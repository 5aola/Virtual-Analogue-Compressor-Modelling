[project]
name = "virtual-analogue-compressor-modelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "auraloss>=0.4.0",
    "essentia-tensorflow>=2.1b6.dev1389",
    "ipykernel>=7.2.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "nablafx>=1.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "soundfile>=0.12.0",
    "tensorflow>=2.18.1",
    "tf-keras>=2.18.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
# Differentiable DSP compressor (02d_digital_pair). torchlpc compiles a C++/
# OpenMP extension that macOS clang cannot build, so this is kept out of the
# default dependency set — install with `uv sync --extra digital-pair` on Linux
# (e.g. Colab), or `pip install torchcomp` in the training notebook.
digital-pair = [
    "torchcomp>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
